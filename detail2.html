<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Produk Mobil 1 - PINSSTORE</title>

  <!-- Bootstrap -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- CSS Custom -->

  <style>
    /* =========================
       GLOBAL
    ========================== */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      color: #212529;
      min-height: 100vh;
    }

    /* =========================
       NAVBAR
    ========================== */
    .navbar {
      background: #111827;
      padding: 15px 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .navbar-brand {
      color: white;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .navbar-brand:hover {
      color: #e5e7eb;
    }

    /* =========================
       PRODUCT SECTION
    ========================== */
    .product-section {
      min-height: calc(100vh - 75px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 15px;
    }

    .product-card {
      width: 100%;
      max-width: 500px;
      border: none;
      border-radius: 20px;
      overflow: hidden;
      background: white;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      transition: all 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    /* =========================
       IMAGE
    ========================== */
    .product-image {
      width: 100%;
      height: 320px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.04);
    }

    /* =========================
       CARD BODY
    ========================== */
    .card-body {
      padding: 30px;
    }

    .card-title {
      color: #111827;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card-text {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    /* =========================
       PRICE
    ========================== */
    .price {
      color: #2563eb;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    /* =========================
       BUTTON
    ========================== */
    .btn {
      border: none;
      border-radius: 25px;
      padding: 10px 22px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: scale(1.05);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .btn-danger:hover {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      transform: scale(1.05);
    }

    /* =========================
       RESPONSIVE
    ========================== */
    @media (max-width: 576px) {

      .product-section {
        padding: 30px 15px;
      }

      .product-image {
        height: 240px;
      }

      .card-body {
        padding: 25px 20px;
      }

      .card-title {
        font-size: 24px;
      }

      .price {
        font-size: 22px;
      }

      .btn {
        padding: 9px 17px;
      }
    }
  </style>

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        PINSSTORE
      </a>
    </div>
  </nav>

  <!-- PRODUCT DETAIL -->

  <div class="product-section">


<div class="product-card">

  <img
    src="mobil2.jpg"
    class="product-image"
    alt="Mobil 1">

  <div class="card-body text-center">

    <h5 class="card-title">
      Nissan GT-R (R35) NISMO
    </h5>

    <p class="card-text">
      Mobil sport premium dengan performa tinggi,
      desain agresif, dan teknologi modern.
      Cocok untuk kamu yang menginginkan pengalaman
      berkendara yang cepat dan stylish.
    </p>

    <div class="price">
       Rp 6,500.000.000
    </div>

    <a href="#" class="btn btn-primary">
      Beli Produk
    </a>

    <a href="index.html" class="btn btn-danger">
      Back
    </a>

  </div>

</div>


  </div>

  <!-- Bootstrap JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
